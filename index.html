          { kr: "냉면 / 마이페이스.", pron: "마와리가 난토 이오-토 지분다케노 스즈시- 마이웨이오 유쿠 마이페-스.", jp: "冷麺 / 周りに何と言われようと、自分だけの涼しいマイウェイを行くマイペース。" },
          { kr: "짜장면 / 추억 수집가.", pron: "토쿠베츠나 히, 우레시이 히고토니 마사키니 오모이우카부 오모이데 코렉타-.", jp: "ジャジャンミョン / 特別な日、嬉しい日ごとに真っ先に思い浮かぶ思い出コレクター。" },
          { kr: "순두부찌개 / 열정파!", pron: "미타메와 야와라카이노니 나카미와 마구마노요-니 아츠이 조-네츠하!", jp: "スンドゥブチゲ / 見た目は柔らかいのに中身は溶岩のように熱い情熱派！" },
          { kr: "삼계탕 / 든든한 힐러!", pron: "츠카레타 히토비토니 디-푸나 에네루기-오 차-지시테 쿠레루 코코로츠요이 히-라-!", jp: "サムゲタン / 疲れた人々に deep なエネルギーを充電してくれる心強いヒーラー！" },
          { kr: "잡채 / 세심함의 끝판왕!", pron: "치이사나 디테-루 히토츠 노가사나이, 마코토고코로니 미치타 코마카사노 키와미!", jp: "チャプチェ / 小さなディテール一つ見逃さない、真心に満ちた細やかさの極み！" },
          { kr: "부대찌개 / 융합형 천재!", pron: "코레코레 마자리앗테모 사이코-노 케카오 츠쿠리다스 유-고-가타 텐사이!", jp: "プデチゲ / あれこれ混ざり合っても最高 Results を作り出す融合型天才！" },
          { kr: "김치 / 명품 신스틸러!", pron: "돈나 바데모 이나이토 사비시-, 카카세나이 메이와키야쿠!", jp: "キムチ / どんな場でもいないと寂しい、欠かせない名脇役（シーンスチーラー）！" }
        ]
      },
      {
        id: "kpop",
        title: "7. 한국 아이돌 그룹명",
        items: [
          { kr: "한국 아이돌 그룹 이름 맞추기 퀴즈입니다", pron: "칸코쿠 아이도루 구루-푸메- 아테 쿠이즈데스", jp: "韓国アイドルグループ名当てクイズです" },
          { kr: "트와이스", pron: "투와이스", jp: "TWICE（トゥワイス）" },
          { kr: "세븐틴", pron: "세분티-은", jp: "SEVENTEEN（セブンティーン）" },
          { kr: "BTS", pron: "비-티-에스", jp: "BTS（ビーティーエス / 防弾少年団）" },
          { kr: "빅뱅", pron: "비구바은", jp: "BIGBANG（ビッグバン）" },
          { kr: "스트레이키즈", pron: "수토레이킷즈", jp: "Stray Kids（ストレイキッズ）" },
          { kr: "블랙핑크", pron: "부라쿠피은쿠", jp: "BLACKPINK（ブラックピンク）" },
          { kr: "에스파", pron: "에수파", jp: "aespa（エスパ）" }
        ]
      }
    ];

    // --- 상태 변수 ---
    let currentSectionIndex = null;
    let currentItemIndex = 0;

    // --- DOM 요소 참조 ---
    const selectView = document.getElementById('section-select-view');
    const studyView = document.getElementById('study-view');
    const sectionList = document.getElementById('section-list');
    
    const cardKr = document.getElementById('card-kr');
    const cardPron = document.getElementById('card-pron');
    const cardJp = document.getElementById('card-jp');
    const progressText = document.getElementById('progress-text');

    const btnBack = document.getElementById('btn-back');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnSpeak = document.getElementById('btn-speak');

    // --- 음성 재생 함수 (TTS) ---
    function speakText(text) {
      if (!('speechSynthesis' in window)) {
        alert("이 브라우저는 음성 재생을 지원하지 않습니다.");
        return;
      }
      window.speechSynthesis.cancel(); // 이전 재생 취소
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    // --- 섹션 목록 생성 ---
    function initSectionList() {
      sectionList.innerHTML = '';
      SECTIONS.forEach((sec, index) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 bg-indigo-50 hover:bg-indigo-100 text-indigo-900 rounded-xl transition duration-200 font-medium flex justify-between items-center";
        btn.innerHTML = `
          <span>${sec.title}</span>
          <span class="text-xs bg-indigo-200 text-indigo-800 px-2 py-1 rounded-full">${sec.items.length}개</span>
        `;
        btn.onclick = () => selectSection(index);
        sectionList.appendChild(btn);
      });
    }

    // --- 섹션 선택 처리 ---
    function selectSection(index) {
      currentSectionIndex = index;
      currentItemIndex = 0;
      selectView.classList.add('hidden');
      studyView.classList.remove('hidden');
      updateCard();
    }

    // --- 카드 내용 업데이트 ---
    function updateCard() {
      const section = SECTIONS[currentSectionIndex];
      const item = section.items[currentItemIndex];

      cardKr.textContent = item.kr;
      cardPron.textContent = item.pron;
      cardJp.textContent = item.jp;
      progressText.textContent = `${currentItemIndex + 1} / ${section.items.length}`;

      // 버튼 상태 처리
      btnPrev.disabled = currentItemIndex === 0;
      btnPrev.className = `py-3 rounded-xl font-semibold transition ${
        currentItemIndex === 0 
          ? "bg-slate-100 text-slate-400 cursor-not-allowed" 
          : "bg-slate-200 text-slate-700 hover:bg-slate-300"
      }`;

      btnNext.disabled = currentItemIndex === section.items.length - 1;
      btnNext.className = `py-3 rounded-xl font-semibold transition ${
        currentItemIndex === section.items.length - 1 
          ? "bg-slate-100 text-slate-400 cursor-not-allowed" 
          : "bg-indigo-600 text-white hover:bg-indigo-700"
      }`;

      // 자동 발음 재생
      speakText(item.jp);
    }

    // --- 이벤트 리스너 설정 ---
    btnBack.onclick = () => {
      window.speechSynthesis.cancel();
      studyView.classList.add('hidden');
      selectView.classList.remove('hidden');
    };

    btnPrev.onclick = () => {
      if (currentItemIndex > 0) {
        currentItemIndex--;
        updateCard();
      }
    };

    btnNext.onclick = () => {
      const section = SECTIONS[currentSectionIndex];
      if (currentItemIndex < section.items.length - 1) {
        currentItemIndex++;
        updateCard();
      }
    };

    btnSpeak.onclick = () => {
      const item = SECTIONS[currentSectionIndex].items[currentItemIndex];
      speakText(item.jp);
    };

    // 초기화
    initSectionList();
  </script>
</body>
</html>
